<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add / Edit Dish - Restaurant Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .bg-bd-emerald { background-color: #006a4e !important; color: white !important; }
        .bg-bd-red { background-color: #f42a41 !important; color: white !important; }
    </style>
</head>
<body class="bg-light">

    <!-- Professional Enterprise Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-bd-emerald shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="/menu"><i class="bi bi-shop text-warning fs-3"></i> Restaurant Pro <span class="badge bg-bd-red fs-6 font-monospace">BD Edition</span></a>
            <div class="collapse navbar-collapse">
                <div class="navbar-nav me-auto">
                    <!-- Admin Only -->
                    <a sec:authorize="hasRole('ADMIN')" class="nav-link" href="/">Dashboard</a>
                    
                    <!-- Public / Everyone -->
                    <a class="nav-link" href="/menu">Browse Menu</a>
                    
                    <!-- Customer Only -->
                    <a sec:authorize="hasRole('CUSTOMER')" class="nav-link" href="/orders/new">Place Order</a>
                    <a sec:authorize="hasRole('CUSTOMER')" class="nav-link" href="/ai-assistant">Chef Recommendations</a>
                    
                    <!-- Staff & Admin Only -->
                    <a sec:authorize="hasAnyRole('ADMIN', 'STAFF')" class="nav-link" href="/orders">All Orders</a>
                    <a sec:authorize="hasAnyRole('ADMIN', 'STAFF')" class="nav-link" href="/orders/new">POS Order Entry</a>
                    
                    <!-- Admin Only Management -->
                    <a sec:authorize="hasRole('ADMIN')" class="nav-link" href="/categories">Categories</a>
                    <a sec:authorize="hasRole('ADMIN')" class="nav-link active fw-bold" href="/add-food">Add New Dish</a>
                    <a sec:authorize="hasRole('ADMIN')" class="nav-link" href="/ai-assistant">Chef Recommendations</a>
                </div>
                
                <div class="d-flex align-items-center gap-2">
                    <span sec:authorize="isAuthenticated()" class="badge bg-light text-dark fw-semibold px-3 py-2">
                        <span sec:authentication="name">User</span> 
                        (<span sec:authorize="hasRole('ADMIN')">ADMIN</span><span sec:authorize="hasRole('STAFF')">STAFF</span><span sec:authorize="hasRole('CUSTOMER')">CUSTOMER</span>)
                    </span>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm fw-semibold">Logout</button>
                    </form>
                    <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-light btn-sm fw-semibold">Sign In</a>
                    <a sec:authorize="isAnonymous()" href="/register" class="btn btn-warning btn-sm fw-semibold text-dark">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 rounded-4">
                    <h3 class="mb-3 fw-bold" th:text="${foodItem.id != null} ? 'Edit Dish' : 'Add New Dish'">Add New Dish</h3>
                    
                    <form th:action="@{/save-food}" th:object="${foodItem}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Dish Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Old Dhaka Shahi Kacchi Biryani" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Category</label>
                            <select name="categoryId" class="form-select">
                                <option value="">Auto-Detect Category based on Dish Name</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.name}" 
                                        th:selected="${foodItem.category != null and foodItem.category.id == cat.id}">
                                    Category
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Spice Level</label>
                            <select th:field="*{spiceLevel}" class="form-select">
                                <option value="Mild">Mild</option>
                                <option value="Medium">Medium</option>
                                <option value="Spicy">Spicy</option>
                                <option value="Naga Spicy">Naga Spicy</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Price in Bangladeshi Taka (৳ BDT)</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="450" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Image URL (Optional)</label>
                            <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/... (Leave blank for default photo)">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Custom Description (Optional)</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Leave empty to auto-generate description"></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="useAi" value="true" id="aiCheck" th:checked="${foodItem.id == null}">
                            <label class="form-check-label text-primary fw-semibold" for="aiCheck">
                                Auto-generate chef description if empty
                            </label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success w-100 fw-bold">Save Dish</button>
                            <a href="/menu" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
