<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration - Restaurant Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-lg p-4 rounded-4" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <h1 class="display-6 fw-bold text-success d-flex align-items-center justify-content-center gap-2"><i class="bi bi-shop"></i> Restaurant Pro</h1>
            <p class="text-muted">Create a Customer Account to Order Online</p>
        </div>

        <!-- Alerts -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/save-user}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Choose Username</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="e.g. john_customer" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Choose Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                Create Account & Sign In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted">
            Already have an account? <a href="/login" class="fw-bold text-success text-decoration-none">Sign In Here</a>
        </div>
    </div>

</body>
</html>
