<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Restaurant Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-lg p-4 rounded-4" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <h1 class="display-6 fw-bold text-success d-flex align-items-center justify-content-center gap-2"><i class="bi bi-shop"></i> Restaurant Pro</h1>
            <p class="text-muted">Sign in to your account</p>
        </div>

        <!-- Success Flash Alert -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}">Success message</span>
        </div>

        <!-- Error Alert -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            Invalid username or password! Please try again.
        </div>

        <!-- Logout Alert -->
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Username" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mt-2 shadow-sm">
                Sign In
            </button>
        </form>

        <div class="mt-3 text-center">
            <p class="text-muted mb-0">New customer? <a href="/register" class="fw-bold text-success text-decoration-none">Sign Up Here</a></p>
        </div>

        <div class="mt-4 pt-3 border-top text-center text-muted small">
            <p class="mb-1"><strong>Default Accounts:</strong></p>
            <p class="mb-0"><strong>Admin:</strong> Psych / Psych (or admin / admin123)</p>
            <p class="mb-0"><strong>Staff:</strong> staff / staff123</p>
            <p class="mb-0"><strong>Customer:</strong> customer / customer123</p>
        </div>
    </div>

</body>
</html>
